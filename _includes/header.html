<header class="site-header">
    <nav class="navbar" aria-label="Navegación principal">
        <a href="{% if page.homepage %}#presentacion{% else %}{{ '/index.html' | relative_url }}{% endif %}" class="logo" aria-label="Mistelar, inicio">
            <span class="logo-mark" aria-hidden="true">✦</span>
            <span class="logo-wordmark" aria-hidden="true"></span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
            <span class="sr-only">Abrir menú</span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </button>

        <div class="nav-links" id="nav-links">
            {% if page.homepage %}
                <a href="#presentacion">Presentación</a>
                <a href="#sesion-cero">Contrato</a>
                <a href="#nave">Nave</a>
                <a href="#personajes">Personajes</a>
                <a href="#reglas">Reglas</a>
                <a href="#cronicas">Crónicas</a>
            {% else %}
                <a href="{{ '/nave.html' | relative_url }}"{% if page.section == 'nave' %} aria-current="page"{% endif %}>Nave</a>
                <a href="{{ '/personajes.html' | relative_url }}"{% if page.section == 'personajes' %} aria-current="page"{% endif %}>Personajes</a>
                <a href="{{ '/index.html#reglas' | relative_url }}">Reglas</a>
                <a href="{{ '/cronicas.html' | relative_url }}"{% if page.section == 'cronicas' %} aria-current="page"{% endif %}>Crónicas</a>
            {% endif %}
        </div>
    </nav>
</header>
