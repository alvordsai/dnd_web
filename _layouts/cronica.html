---
layout: default
---
<article class="chronicle-page-shell">
    <a class="character-back" href="{{ '/index.html#cronicas' | relative_url }}"><span aria-hidden="true">←</span> Volver a crónicas</a>
    <header class="chronicle-page-header">
        <span class="rule-pill">{{ page.session_label | default: "Crónica" }}{% if page.date_label %} · {{ page.date_label }}{% endif %}</span>
        <h1>{{ page.title }}</h1>
        {% if page.summary %}<p>{{ page.summary }}</p>{% endif %}
    </header>
    <div class="chronicle-page-content">
        {{ content }}
    </div>
</article>
