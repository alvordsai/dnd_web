collections:
  personajes:
    output: true
    permalink: /personajes/:name/
  cronicas:
    output: true
    permalink: /cronicas/:name/

defaults:
  - scope:
      path: ""
      type: personajes
    values:
      layout: personaje
      body_class: inner-page character-page
      section: personajes
      footer_text: Mistelar · Rostros del firmamento
  - scope:
      path: ""
      type: cronicas
    values:
      layout: cronica
      body_class: inner-page chronicle-page
      section: cronicas
      footer_text: Mistelar · Bitácora de la tripulación
